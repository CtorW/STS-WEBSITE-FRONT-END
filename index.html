<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Science Nexus ⚛️</title>
  <link rel="stylesheet" href="src/style.css" />
  <link rel="shortcut icon" href="src/logos/science-logo.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
  <div class="navbar-overlay"></div>
  <nav class="navbar">
    <a href="index.html" style="text-decoration: none">
      <div class="navbar-header"><span>Science Nexus ⚛️</span></div>
    </a>
    <ul>
      <li>
        <h2 class="nav-heading">Main</h2>
      </li>
      <li><a href="#home" id="nav-home" class="nav-link">Home</a></li>
      <li>
        <a href="#articles" id="nav-articles" class="nav-link">Articles</a>
      </li>
      <li>
        <a href="#advertisement" id="nav-advertisement" class="nav-link">Advertisement</a>
      </li>
      <li>
        <a href="#timeline" id="nav-timeline" class="nav-link">Timeline</a>
      </li>
      <li>
        <a href="#glossary" id="nav-glossary" class="nav-link">Glossary</a>
      </li>
    </ul>
    <hr class="nav-divider" />
    <ul>
      <li>
        <h2 class="nav-heading">Project</h2>
      </li>
      <li><a href="#about" id="nav-about" class="nav-link">About</a></li>
      <li><a href="games.html" class="nav-link">Games & Quiz</a></li>
    </ul>
  </nav>

  <div class="page-wrapper">
    <main class="main-content-wrapper">
      <header class="main-header">
        <button class="icon-btn menu-btn" aria-label="Open navigation menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <div style="display: flex; align-items: center; gap: 8px">
          <button class="icon-btn" aria-label="GitHub">
            <span class="material-symbols-outlined">code</span>
          </button>
          <button class="icon-btn" id="search-btn" aria-label="Open search">
            <span class="material-symbols-outlined">search</span>
          </button>
          <div class="theme-switcher">
            <button class="icon-btn" id="light-theme-btn" aria-label="Switch to light theme">
              <span class="material-symbols-outlined">light_mode</span>
            </button>
            <button class="icon-btn" id="dark-theme-btn" aria-label="Switch to dark theme">
              <span class="material-symbols-outlined">dark_mode</span>
            </button>
          </div>
        </div>
      </header>
      <div class="content-card" id="content-card">
        <div id="content-container"></div>
      </div>
    </main>

    <aside class="right-sidebar">
      <div class="sidebar-content" id="sidebar-container"></div>
    </aside>
  </div>

  <div id="search-overlay" class="search-overlay" style="flex-direction: column; align-items: center">
    <div class="search-modal">
      <span class="material-symbols-outlined">search</span><input type="search" id="search-input"
        placeholder="Search our knowledge 🔍👽" /><button class="icon-btn" id="close-search-btn" aria-label="Close search">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div id="search-results"></div>
  </div>
  <div id="article-overlay" class="article-overlay">
    <div class="article-modal" id="article-modal">
      <header class="modal-header">
        <button class="icon-btn" id="close-article-btn" aria-label="Close article">
          <span class="material-symbols-outlined">close</span>
        </button>
      </header>
      <div class="modal-content-wrapper" id="article-modal-content-wrapper">
        <div id="article-modal-content"></div>
      </div>
    </div>
  </div>
  <script src="src/main.js"></script>
</body>

</html>
